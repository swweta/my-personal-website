<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>The Sweta Chronicle</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #faf7fd;
      text-align: center;
      color: #4B0082;
    }

    .container {
      padding: 50px 20px;
    }

    .profile-pic {
      width: 180px;
      height: 180px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #9370DB;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 2.8em;
      margin: 10px 0;
      color: #800080;
    }

    h2 {
      font-size: 1.5em;
      margin: 10px 0 30px;
      color: #9370DB;
    }

    p {
      font-size: 1.1em;
      max-width: 600px;
      margin: 0 auto 40px;
      color: #5a4e6d;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .buttons a {
      text-decoration: none;
      padding: 15px 30px;
      border-radius: 30px;
      font-weight: bold;
      background-color: #E6E6FA;
      color: #4B0082;
      border: 2px solid #9370DB;
      transition: 0.3s ease;
    }

    .buttons a:hover {
      background-color: #D8BFD8;
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <div class="container">
   <img src="images/IMG_0817.jpeg" alt="Sweta Profile" class="profile-pic" />
    <h1>The Sweta Chronicle</h1>
    <h2>Wandering with Sweta</h2>
    <p>
      Stats major. Storyteller. Explorer. <br />
      Welcome to my journey — through data, destinations, and daydreams.
    </p>
    <div class="buttons">
      <a href="#">Resume</a>
      <a href="#">Projects</a>
      <a href="#">Contact</a>
    </div>
  </div>
</body>
</html>
